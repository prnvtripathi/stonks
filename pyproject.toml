[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stonks-market-pipeline"
version = "0.1.0"
description = "Private end-of-day Indian markets research data pipeline"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hypothesis>=6.138,<7",
    "pydantic>=2.11,<3",
    "polars>=1.32,<2",
    "pyarrow>=20,<21",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
