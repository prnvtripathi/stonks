name: Daily Data Refresh

# Schedule: NSE's official EOD bhavcopy is typically published in the early
# evening IST. Asia/Kolkata is UTC+5:30, so 13:30 UTC lands at 19:00 IST,
# comfortably after expected EOD availability. GitHub Actions cron always
# runs in UTC, and its day-of-week field also uses UTC days; 1-5 (Mon-Fri
# UTC) is used as a practical proxy for NSE's Mon-Fri IST trading week since
# the UTC weekday only diverges from the IST weekday very close to midnight
# IST, well outside this run window.
#
# IMPORTANT LIMITATION: automated network fetch adapters for NSE are
# deliberately not wired into this pipeline (NSE's Terms of Use currently
# prohibit automated collection - see docs/operations/source-policy.md).
# This workflow therefore does not fetch artifacts itself; it invokes the
# existing `market-pipeline` CLI against an operator/job-runner-supplied
# artifact manifest (see docs/operations/daily-run.md for how that manifest
# is produced today). What this workflow *does* own end-to-end is the
# scheduling, concurrency lock, reconciliation/budget safety gate, and
# redacted operator reporting around that CLI invocation.
on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (single date) or backfill (date range)"
        type: choice
        options:
          - daily
          - backfill
        default: daily
      date:
        description: "Effective date for daily mode (YYYY-MM-DD)"
        required: false
        type: string
      start:
        description: "Backfill start date, inclusive (YYYY-MM-DD)"
        required: false
        type: string
      end:
        description: "Backfill end date, inclusive (YYYY-MM-DD)"
        required: false
        type: string
      manifest_path:
        description: "Path (within the checked-out repo) to a pre-fetched artifact manifest JSON"
        required: true
        type: string
      previous_count:
        description: "Known-good previous completed-artifact count, for coverage reconciliation"
        required: false
        type: string
      min_coverage_ratio:
        description: "Minimum candidate/previous coverage ratio before a run is flagged non-publishable"
        required: false
        type: string
        default: "0.90"

# A scheduled run and a manually triggered run must never race each other
# against the same database/dataset: queue, do not run concurrently, and
# never cancel a run that is already in progress (a cancelled mid-write run
# is exactly the kind of partial state reconciliation exists to catch).
concurrency:
  group: daily-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: daily-data-refresh
    env:
      # These values are scoped to the daily-data-refresh GitHub Environment.
      # They are intentionally never echoed or copied into an artifact.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"

      - name: Install Python dependencies
        run: uv sync --locked

      # A scheduled run has no `inputs` context, so it looks for a manifest at
      # the conventional path. No automated NSE/AMFI fetch is wired (Task 2's
      # Terms-of-Use ruling), so producing that manifest is an operator step
      # and the file is frequently absent. An absent manifest is a normal
      # "nothing to do today", not an incident: the run is skipped cleanly
      # instead of crashing the CLI with exit 2 and paging the operator every
      # weekday forever. See docs/operations/daily-run.md.
      - name: Resolve run parameters
        id: params
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mode="daily"
            date="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
            manifest="manifests/daily.json"
          else
            mode="${{ inputs.mode }}"
            date="${{ inputs.date }}"
            manifest="${{ inputs.manifest_path }}"
          fi
          if [ -n "$manifest" ] && [ -r "$manifest" ]; then
            echo "manifest_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No manifest supplied for this run (looked for '''${manifest:-<empty>}'''). No automated source fetch is wired, so this run is skipped rather than failed. Trigger Daily Data Refresh manually with a manifest_path once an artifact manifest has been produced."
            {
              echo "# Daily data refresh skipped"
              echo
              echo "No artifact manifest was present at \`${manifest:-<empty>}\`."
              echo "Producing that manifest is an operator step -- no automated NSE/AMFI"
              echo "fetch is wired (see docs/operations/source-policy.md). Nothing was"
              echo "published and the last known-good dataset is untouched."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
          echo "end=${{ inputs.end }}" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "previous_count=${{ inputs.previous_count }}" >> "$GITHUB_OUTPUT"
          echo "min_coverage_ratio=${{ inputs.min_coverage_ratio || '0.90' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node for Wrangler
        if: steps.params.outputs.manifest_present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Set up Node runtime for Wrangler
        if: steps.params.outputs.manifest_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install pinned Wrangler dependency
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # market.db is the CLI's own persistent state (backfill checkpoints and
      # the pipeline_run_history table the CLI uses to derive a real
      # coverage-drop baseline -- see market_pipeline/cli.py). It must
      # survive across job runs on this ephemeral runner, or every run would
      # look like a first-ever run: the scheduled (cron) trigger has no
      # `inputs` context to source a --previous-count from, and relies
      # entirely on the CLI reading its own database's last safe-to-promote
      # run. `key` is always unique so a new cache entry is written every
      # run; `restore-keys` falls back to the most recently written entry
      # with this prefix, which is what makes each run pick up the previous
      # run's database.
      - name: Restore market database from previous run
        if: steps.params.outputs.manifest_present == 'true'
        uses: actions/cache/restore@v4
        with:
          # `raw/` holds immutable artifact bodies; `history/` holds published
          # history objects. The publication stage re-reads `raw/`
          # to rebuild the three-year NAV series a twelve-month return needs,
          # so losing it would silently reduce every run to one session of
          # history.
          path: |
            market.db
            raw
            history
          key: market-db-${{ github.run_id }}
          restore-keys: |
            market-db-

      - name: Run market-pipeline refresh
        id: run
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          args=(--db market.db daily)
          if [ "${{ steps.params.outputs.mode }}" = "backfill" ]; then
            args=(--db market.db backfill --start "${{ steps.params.outputs.start }}" --end "${{ steps.params.outputs.end }}")
          else
            args+=(--date "${{ steps.params.outputs.date }}")
          fi
          args+=(--manifest "${{ steps.params.outputs.manifest }}")
          args+=(--min-coverage-ratio "${{ steps.params.outputs.min_coverage_ratio }}")
          if [ -n "${{ steps.params.outputs.previous_count }}" ]; then
            args+=(--previous-count "${{ steps.params.outputs.previous_count }}")
          fi
          set +e
          uv run market-pipeline "${args[@]}" > run-report.json 2> run-error.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Save market database for next run
        if: always() && steps.params.outputs.manifest_present == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            market.db
            raw
            history
          key: market-db-${{ github.run_id }}

      - name: Redact and publish operator report
        if: always() && steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          SECRET_KEY_PATTERN = re.compile(r"(token|secret|password|authorization|api[_-]?key)", re.IGNORECASE)

          def redact(value):
              if isinstance(value, dict):
                  return {
                      key: ("***redacted***" if SECRET_KEY_PATTERN.search(key) else redact(val))
                      for key, val in value.items()
                  }
              if isinstance(value, list):
                  return [redact(item) for item in value]
              return value

          report = {}
          for name in ("run-report.json", "run-error.json"):
              path = Path(name)
              if not path.exists() or not path.read_text().strip():
                  continue
              try:
                  report[name] = redact(json.loads(path.read_text()))
              except json.JSONDecodeError:
                  report[name] = "***unparseable output, omitted***"

          Path("reconciliation-report.json").write_text(json.dumps(report, indent=2, sort_keys=True))

          summary_lines = ["# Daily data refresh report", ""]
          run_report = report.get("run-report.json")
          if isinstance(run_report, dict):
              reconciliation = run_report.get("reconciliation", {})
              budget = run_report.get("budget", {})
              publication = run_report.get("publication") or {}
              summary_lines += [
                  f"- **Safe to promote:** {run_report.get('safe_to_promote')}",
                  f"- **Promoted dataset:** {publication.get('dataset_id')}"
                  f" (promoted={publication.get('promoted')}, {publication.get('instrument_count')} instruments)",
                  f"- **Publication note:** {publication.get('reason') or 'none'}",
                  f"- **Coverage ratio:** {reconciliation.get('coverage_ratio')}"
                  f" (min {reconciliation.get('min_coverage_ratio')})",
                  f"- **Storage budget:** {budget.get('ratio')} of limit"
                  f" (warning={budget.get('warning')}, exceeded={budget.get('exceeded')})",
                  "",
                  "## Blocking reasons",
              ]
              reasons = run_report.get("blocking_reasons") or []
              summary_lines += [f"- {reason}" for reason in reasons] or ["- none"]
          else:
              summary_lines.append("Run produced no parseable report (see run-error.json).")
          Path("summary.md").write_text("\n".join(summary_lines))
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted report artifact
        if: always() && steps.params.outputs.manifest_present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-data-reconciliation-report
          path: reconciliation-report.json
          retention-days: 90

      - name: Stop before promotion on blocking failure
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          exit_code="${{ steps.run.outputs.exit_code }}"
          if [ "$exit_code" != "0" ]; then
            echo "::error::market-pipeline exited $exit_code; this candidate must not be promoted. See the reconciliation-report artifact and job summary for details."
            exit "$exit_code"
          fi
          echo "Reconciliation and budget checks passed; candidate is safe to promote."

      - name: Export locally active dataset for D1
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          uv run python -m market_pipeline.publication.d1_export \
            --db market.db --output active-dataset.sql --history-root history \
            --object-manifest active-history-objects.json \
            --publication-plan active-publication-plan.json > active-dataset-id.txt

      - name: Read production D1 publication capacity
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          pnpm --dir apps/api exec wrangler d1 info stonks-research --env production --json > d1-publication-info.json

      - name: Preflight remote publication budget
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          MAX_D1_MUTATIONS_PER_RUN=50000
          MAX_D1_ROWS_WRITTEN_24H=90000
          MAX_D1_DATABASE_BYTES=400000000
          MAX_R2_CLASS_A_PER_MONTH=500000
          MAX_R2_CLASS_B_PER_MONTH=5000000
          WEEKDAY_RUNS_PER_MONTH=22
          if ! uv run python -m market_pipeline.publication.preflight --plan active-publication-plan.json \
            --d1-info d1-publication-info.json \
            --max-d1-mutations-per-run "${MAX_D1_MUTATIONS_PER_RUN}" \
            --max-d1-rows-written-24h "${MAX_D1_ROWS_WRITTEN_24H}" \
            --max-d1-database-bytes "${MAX_D1_DATABASE_BYTES}" \
            --max-r2-class-a-per-month "${MAX_R2_CLASS_A_PER_MONTH}" \
            --max-r2-class-b-per-month "${MAX_R2_CLASS_B_PER_MONTH}" \
            --weekday-runs-per-month "${WEEKDAY_RUNS_PER_MONTH}"; then
            echo "::error::remote publication plan exceeds the free-tier safety envelope"
            exit 1
          fi

      - name: Upload and verify private R2 history objects
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r object_key; do
            history_file="history/${object_key}"
            remote_object="stonks-private-history/${object_key}"
            verified_file="$(mktemp)"
            trap 'rm -f "${verified_file}"' EXIT
            pnpm --dir apps/api exec wrangler r2 object put "${remote_object}" --file "${history_file}" --remote --env production
            pnpm --dir apps/api exec wrangler r2 object get "${remote_object}" --file "${verified_file}" --remote --env production
            cmp --silent "${history_file}" "${verified_file}"
            rm -f "${verified_file}"
            trap - EXIT
          done < <(python3 - active-history-objects.json <<'PY'
          import json
          import sys
          from pathlib import Path, PurePosixPath

          manifest_path = Path(sys.argv[1])
          root = Path("history").resolve()
          try:
              keys = json.loads(manifest_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"invalid active history manifest: {exc}")
          if not isinstance(keys, list) or not keys:
              raise SystemExit("active history manifest must contain at least one object")
          for key in keys:
              if not isinstance(key, str) or not key or "\x00" in key or "\n" in key or "\r" in key:
                  raise SystemExit("active history manifest has an invalid object key")
              relative = PurePosixPath(key)
              if relative.is_absolute() or ".." in relative.parts or relative.parts[0] not in {"history", "charts"}:
                  raise SystemExit("active history manifest object escapes the history root")
              local = (root / relative).resolve()
              if not local.is_relative_to(root) or not local.is_file():
                  raise SystemExit(f"active history manifest object is missing: {key}")
              print(key)
          PY
          )

      - name: Import active dataset into production D1
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          pnpm --dir apps/api exec wrangler d1 execute stonks-research --env production --remote --file active-dataset.sql

      - name: Verify remote active dataset
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          expected_dataset_id="$(tr -d '\r\n' < active-dataset-id.txt)"
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          pnpm --dir apps/api exec wrangler d1 execute stonks-research --env production --remote \
            --command "SELECT dataset_id FROM active_dataset WHERE singleton = 1" --json > "${response_file}"
          remote_dataset_id="$(python3 - "${response_file}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          result = payload[0] if isinstance(payload, list) else payload
          rows = result.get("results", [])
          if len(rows) != 1 or not isinstance(rows[0].get("dataset_id"), str):
              raise SystemExit("remote D1 active_dataset query did not return exactly one dataset_id")
          print(rows[0]["dataset_id"])
          PY
          )"
          if [ "${remote_dataset_id}" != "${expected_dataset_id}" ]; then
            echo "::error::Remote active dataset does not match the locally published dataset."
            exit 1
          fi
