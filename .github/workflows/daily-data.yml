name: Daily Data Refresh

# Schedule: NSE's official EOD bhavcopy is typically published in the early
# evening IST. Asia/Kolkata is UTC+5:30, so 13:30 UTC lands at 19:00 IST,
# comfortably after expected EOD availability. GitHub Actions cron always
# runs in UTC, and its day-of-week field also uses UTC days; 1-5 (Mon-Fri
# UTC) is used as a practical proxy for NSE's Mon-Fri IST trading week since
# the UTC weekday only diverges from the IST weekday very close to midnight
# IST, well outside this run window.
#
# IMPORTANT LIMITATION: automated network fetch adapters for NSE are
# deliberately not wired into this pipeline (NSE's Terms of Use currently
# prohibit automated collection - see docs/operations/source-policy.md).
# This workflow therefore does not fetch artifacts itself; it invokes the
# existing `market-pipeline` CLI against an operator/job-runner-supplied
# artifact manifest (see docs/operations/daily-run.md for how that manifest
# is produced today). What this workflow *does* own end-to-end is the
# scheduling, concurrency lock, reconciliation/budget safety gate, and
# redacted operator reporting around that CLI invocation.
on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (single date) or backfill (date range)"
        type: choice
        options:
          - daily
          - backfill
        default: daily
      date:
        description: "Effective date for daily mode (YYYY-MM-DD)"
        required: false
        type: string
      start:
        description: "Backfill start date, inclusive (YYYY-MM-DD)"
        required: false
        type: string
      end:
        description: "Backfill end date, inclusive (YYYY-MM-DD)"
        required: false
        type: string
      manifest_path:
        description: "Path (within the checked-out repo) to a pre-fetched artifact manifest JSON"
        required: true
        type: string
      previous_count:
        description: "Known-good previous completed-artifact count, for coverage reconciliation"
        required: false
        type: string
      min_coverage_ratio:
        description: "Minimum candidate/previous coverage ratio before a run is flagged non-publishable"
        required: false
        type: string
        default: "0.90"

# A scheduled run and a manually triggered run must never race each other
# against the same database/dataset: queue, do not run concurrently, and
# never cancel a run that is already in progress (a cancelled mid-write run
# is exactly the kind of partial state reconciliation exists to catch).
#
# R12/F15: this workflow's `refresh` job and .github/workflows/deploy.yml's
# `production` job both write to the same production D1 database (this
# workflow through market-pipeline's publication path, deploy.yml through
# `wrangler d1 migrations apply ... --env production`), but until now each
# workflow had its own independent concurrency group -- a manually
# dispatched daily-data run and an in-flight deploy.yml production
# migration/deploy were never mutually exclusive against each other, only
# against runs of their own workflow. `production-d1-writer` is the same
# group name deploy.yml's `production` job now declares (job-level, not
# workflow-level, there -- see that file's comment for why), so this run
# queues behind an in-flight production deploy and vice versa. deploy.yml's
# `preview` job intentionally does NOT share this group: it never touches
# the production database, so there is no reason for a preview deploy to
# queue behind a daily data refresh.
concurrency:
  group: production-d1-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Below six hours overall (F14): a hosted-runner job that never
    # terminates on a hang would otherwise queue indefinitely behind
    # `concurrency.group: daily-data`'s `cancel-in-progress: false`, and
    # each individual publication step below is independently bounded to
    # well under four hours so a hang there cannot silently eat this
    # budget either.
    timeout-minutes: 330
    environment: daily-data-refresh
    env:
      # These values are scoped to the daily-data-refresh GitHub Environment.
      # They are intentionally never echoed or copied into an artifact.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # R2's S3-compatible API is authenticated separately from the
      # Cloudflare API token above: this is an R2 API token (Access Key
      # ID / Secret Access Key pair) scoped to only the
      # stonks-private-history bucket, created independently in the
      # Cloudflare dashboard (R2 > Manage R2 API Tokens). It never has
      # D1, Workers, or account-wide permissions -- see
      # docs/operations/security-checklist.md section 7.
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"

      - name: Install Python dependencies
        run: uv sync --locked

      # A scheduled run has no `inputs` context, so it looks for a manifest at
      # the conventional path. No automated NSE/AMFI fetch is wired (Task 2's
      # Terms-of-Use ruling), so producing that manifest is an operator step
      # and the file is frequently absent. An absent manifest is a normal
      # "nothing to do today", not an incident: the run is skipped cleanly
      # instead of crashing the CLI with exit 2 and paging the operator every
      # weekday forever. See docs/operations/daily-run.md.
      - name: Resolve run parameters
        id: params
        # R12/F15: the free-form workflow_dispatch string inputs below
        # (date, start, end, manifest_path, previous_count,
        # min_coverage_ratio -- everything except `mode`, which is a
        # `type: choice` and already enum-constrained by GitHub Actions)
        # used to be interpolated directly into this script's *text* via
        # `"${{ inputs.X }}"`, the classic Actions script-injection pattern:
        # a value containing shell metacharacters (e.g. `"; rm -rf . #`)
        # becomes part of the generated script rather than staying a
        # quoted argument. They are now passed through `env:` (GitHub
        # Actions writes env values as literal environment variable
        # content, not interpolated script text) and referenced as shell
        # variables, plus validated against an expected format before use
        # anywhere -- including before being re-exposed as this step's own
        # outputs, which a later step also consumes by direct
        # interpolation (see the pipeline invocation step further below).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_PREVIOUS_COUNT: ${{ inputs.previous_count }}
          INPUT_MIN_COVERAGE_RATIO: ${{ inputs.min_coverage_ratio }}
        run: |
          set -euo pipefail
          date_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if [ "$EVENT_NAME" = "schedule" ]; then
            mode="daily"
            date="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
            manifest="manifests/daily.json"
            start=""
            end=""
            previous_count=""
            min_coverage_ratio="0.90"
          else
            mode="$INPUT_MODE"
            date="$INPUT_DATE"
            start="$INPUT_START"
            end="$INPUT_END"
            manifest="$INPUT_MANIFEST_PATH"
            previous_count="$INPUT_PREVIOUS_COUNT"
            min_coverage_ratio="${INPUT_MIN_COVERAGE_RATIO:-0.90}"

            if [ "$mode" != "daily" ] && [ "$mode" != "backfill" ]; then
              echo "::error::mode must be 'daily' or 'backfill', got '$mode'"
              exit 1
            fi
            if [ -n "$date" ] && ! [[ "$date" =~ $date_re ]]; then
              echo "::error::date must match YYYY-MM-DD, got '$date'"
              exit 1
            fi
            if [ -n "$start" ] && ! [[ "$start" =~ $date_re ]]; then
              echo "::error::start must match YYYY-MM-DD, got '$start'"
              exit 1
            fi
            if [ -n "$end" ] && ! [[ "$end" =~ $date_re ]]; then
              echo "::error::end must match YYYY-MM-DD, got '$end'"
              exit 1
            fi
            if [ -n "$previous_count" ] && ! [[ "$previous_count" =~ ^[0-9]+$ ]]; then
              echo "::error::previous_count must be a non-negative integer, got '$previous_count'"
              exit 1
            fi
            if ! [[ "$min_coverage_ratio" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::min_coverage_ratio must be numeric, got '$min_coverage_ratio'"
              exit 1
            fi
            case "$manifest" in
              /*|*..*)
                echo "::error::manifest_path must be a relative path within the checked-out repo (no leading / and no '..'), got '$manifest'"
                exit 1
                ;;
            esac
          fi
          if [ -n "$manifest" ] && [ -r "$manifest" ]; then
            echo "manifest_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No manifest supplied for this run (looked for '''${manifest:-<empty>}'''). No automated source fetch is wired, so this run is skipped rather than failed. Trigger Daily Data Refresh manually with a manifest_path once an artifact manifest has been produced."
            {
              echo "# Daily data refresh skipped"
              echo
              echo "No artifact manifest was present at \`${manifest:-<empty>}\`."
              echo "Producing that manifest is an operator step -- no automated NSE/AMFI"
              echo "fetch is wired (see docs/operations/source-policy.md). Nothing was"
              echo "published and the last known-good dataset is untouched."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "previous_count=$previous_count" >> "$GITHUB_OUTPUT"
          echo "min_coverage_ratio=$min_coverage_ratio" >> "$GITHUB_OUTPUT"

      - name: Set up Node for Wrangler
        if: steps.params.outputs.manifest_present == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node runtime for Wrangler
        if: steps.params.outputs.manifest_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install pinned Wrangler dependency
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # market.db is the CLI's own persistent state (backfill checkpoints and
      # the pipeline_run_history table the CLI uses to derive a real
      # coverage-drop baseline -- see market_pipeline/cli.py). It must
      # survive across job runs on this ephemeral runner, or every run would
      # look like a first-ever run: the scheduled (cron) trigger has no
      # `inputs` context to source a --previous-count from, and relies
      # entirely on the CLI reading its own database's last safe-to-promote
      # run. `key` is always unique so a new cache entry is written every
      # run; `restore-keys` falls back to the most recently written entry
      # with this prefix, which is what makes each run pick up the previous
      # run's database.
      - name: Restore market database from previous run
        if: steps.params.outputs.manifest_present == 'true'
        uses: actions/cache/restore@v4
        with:
          # `raw/` holds immutable artifact bodies; `history/` holds published
          # history objects. The publication stage re-reads `raw/`
          # to rebuild the three-year NAV series a twelve-month return needs,
          # so losing it would silently reduce every run to one session of
          # history.
          path: |
            market.db
            raw
            history
            .cache/publication-ledger.json
          key: market-db-${{ github.run_id }}
          restore-keys: |
            market-db-

      # F12: `actions/cache` above is the fast path between runs, but
      # GitHub documents cache eviction -- a miss here previously meant
      # three years of raw/checkpoint state were gone with no recovery
      # path. This step is the durable fallback: on a genuine cache miss
      # (no `market.db` present), it restores the last verified checkpoint
      # archive from private R2 storage instead of silently starting
      # blank. On a cache hit, it validates the cached `market.db`/`raw/`'s
      # identity AND raw-store completeness against the authoritative
      # remote manifest -- not just a warning: a detected mismatch (a
      # stale cache entry, or a partial `raw/` from an interrupted save)
      # discards the untrusted local state and forces the same real
      # restore a cache miss would have done, so the pipeline is never run
      # against local state this step could not itself vouch for. A
      # missing archive (no prior successful publication has ever run) is
      # a legitimate first-ever-run bootstrap, not treated as a failure;
      # any other problem (a corrupt or partially-uploaded archive) fails
      # this step outright rather than silently continuing with
      # blank/stale/partial state.
      - name: Restore checkpoint archive on cache miss
        if: steps.params.outputs.manifest_present == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p .cache
          need_restore=1
          if [ -f market.db ]; then
            need_restore=0
            uv run python -m market_pipeline.publication.checkpoint_archive restore \
              --db market.db --raw-root raw --check-identity-only --result identity-check.json
            matches="$(python3 -c "import json; print(json.load(open('identity-check.json')).get('matches'))")"
            if [ "${matches}" = "False" ]; then
              echo "::warning::Cached market.db/raw do not match the last verified checkpoint archive (stale or partially-saved cache entry); discarding the cached state and restoring from private R2 storage instead."
              rm -rf market.db raw
              need_restore=1
            fi
          fi
          if [ "${need_restore}" = "1" ]; then
            echo "::notice::No trustworthy cached market.db present; restoring the last verified checkpoint archive from private R2 storage."
            uv run python -m market_pipeline.publication.checkpoint_archive restore \
              --db market.db --raw-root raw --reservation-ledger .cache/publication-ledger.json --result checkpoint-restore.json
            cat checkpoint-restore.json
          fi

      - name: Run market-pipeline refresh
        id: run
        if: steps.params.outputs.manifest_present == 'true'
        # Same script-injection concern as "Resolve run parameters" above:
        # these values are already validated by that step, but they are
        # still passed through `env:` here rather than interpolated
        # directly into the script text, so this step never re-introduces
        # the pattern even if the validation above is ever loosened.
        env:
          PARAM_MODE: ${{ steps.params.outputs.mode }}
          PARAM_DATE: ${{ steps.params.outputs.date }}
          PARAM_START: ${{ steps.params.outputs.start }}
          PARAM_END: ${{ steps.params.outputs.end }}
          PARAM_MANIFEST: ${{ steps.params.outputs.manifest }}
          PARAM_PREVIOUS_COUNT: ${{ steps.params.outputs.previous_count }}
          PARAM_MIN_COVERAGE_RATIO: ${{ steps.params.outputs.min_coverage_ratio }}
        run: |
          set -euo pipefail
          args=(--db market.db daily)
          if [ "$PARAM_MODE" = "backfill" ]; then
            args=(--db market.db backfill --start "$PARAM_START" --end "$PARAM_END")
          else
            args+=(--date "$PARAM_DATE")
          fi
          args+=(--manifest "$PARAM_MANIFEST")
          args+=(--min-coverage-ratio "$PARAM_MIN_COVERAGE_RATIO")
          if [ -n "$PARAM_PREVIOUS_COUNT" ]; then
            args+=(--previous-count "$PARAM_PREVIOUS_COUNT")
          fi
          set +e
          uv run market-pipeline "${args[@]}" > run-report.json 2> run-error.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Save market database for next run
        if: always() && steps.params.outputs.manifest_present == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            market.db
            raw
            history
            .cache/publication-ledger.json
          key: market-db-${{ github.run_id }}

      - name: Redact and publish operator report
        if: always() && steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          SECRET_KEY_PATTERN = re.compile(r"(token|secret|password|authorization|api[_-]?key)", re.IGNORECASE)

          def redact(value):
              if isinstance(value, dict):
                  return {
                      key: ("***redacted***" if SECRET_KEY_PATTERN.search(key) else redact(val))
                      for key, val in value.items()
                  }
              if isinstance(value, list):
                  return [redact(item) for item in value]
              return value

          report = {}
          for name in ("run-report.json", "run-error.json"):
              path = Path(name)
              if not path.exists() or not path.read_text().strip():
                  continue
              try:
                  report[name] = redact(json.loads(path.read_text()))
              except json.JSONDecodeError:
                  report[name] = "***unparseable output, omitted***"

          Path("reconciliation-report.json").write_text(json.dumps(report, indent=2, sort_keys=True))

          summary_lines = ["# Daily data refresh report", ""]
          run_report = report.get("run-report.json")
          if isinstance(run_report, dict):
              reconciliation = run_report.get("reconciliation", {})
              budget = run_report.get("budget", {})
              publication = run_report.get("publication") or {}
              summary_lines += [
                  f"- **Safe to promote:** {run_report.get('safe_to_promote')}",
                  f"- **Promoted dataset:** {publication.get('dataset_id')}"
                  f" (promoted={publication.get('promoted')}, {publication.get('instrument_count')} instruments)",
                  f"- **Publication note:** {publication.get('reason') or 'none'}",
                  f"- **Coverage ratio:** {reconciliation.get('coverage_ratio')}"
                  f" (min {reconciliation.get('min_coverage_ratio')})",
                  f"- **Storage budget:** {budget.get('ratio')} of limit"
                  f" (warning={budget.get('warning')}, exceeded={budget.get('exceeded')})",
                  "",
                  "## Blocking reasons",
              ]
              reasons = run_report.get("blocking_reasons") or []
              summary_lines += [f"- {reason}" for reason in reasons] or ["- none"]
          else:
              summary_lines.append("Run produced no parseable report (see run-error.json).")
          Path("summary.md").write_text("\n".join(summary_lines))
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted report artifact
        if: always() && steps.params.outputs.manifest_present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-data-reconciliation-report
          path: reconciliation-report.json
          retention-days: 90

      - name: Stop before promotion on blocking failure
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          exit_code="${{ steps.run.outputs.exit_code }}"
          if [ "$exit_code" != "0" ]; then
            echo "::error::market-pipeline exited $exit_code; this candidate must not be promoted. See the reconciliation-report artifact and job summary for details."
            exit "$exit_code"
          fi
          echo "Reconciliation and budget checks passed; candidate is safe to promote."

      - name: Export locally active dataset for D1
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          uv run python -m market_pipeline.publication.d1_export \
            --db market.db --output active-dataset.sql --history-root history \
            --object-manifest active-history-objects.json \
            --publication-plan active-publication-plan.json > active-dataset-id.txt

      - name: Read production D1 publication capacity
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          pnpm --dir apps/api exec wrangler d1 info stonks-research --env production --json > d1-publication-info.json

      - name: Read production capacity telemetry (GraphQL Analytics)
        if: steps.params.outputs.manifest_present == 'true'
        timeout-minutes: 5
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          # F11: `wrangler d1 info` (read above, kept only as a secondary,
          # informational data point) silently defaults missing metrics to
          # zero, so it cannot distinguish "genuinely no usage" from "the
          # token/permission/account/database is wrong". This step instead
          # calls Cloudflare's authenticated GraphQL Analytics API directly
          # -- it requires the `Account Analytics Read` permission, see
          # docs/operations/security-checklist.md section 7 -- and reshapes
          # its response into the strict shape
          # market_pipeline.publication.remote_usage.validate_remote_usage
          # rejects unless every dimension, timestamp, and identity check
          # passes. This query and reshape have been written and reasoned
          # through against Cloudflare's documented GraphQL Analytics
          # schema but have NOT been executed against a live account as
          # part of this change -- see the R09 task report.
          window_start="$(date -u +%Y-%m-01T00:00:00Z)"
          request_body="$(python3 - "${CLOUDFLARE_ACCOUNT_ID}" "${CLOUDFLARE_D1_DATABASE_ID}" "${window_start}" <<'PY'
          import json
          import sys

          account_tag, database_id, window_start = sys.argv[1:4]
          query = """
          query ($accountTag: String!, $databaseId: String!, $bucketName: String!, $since: Time!) {
            viewer {
              accounts(filter: {accountTag: $accountTag}) {
                d1AnalyticsAdaptiveGroups(limit: 1, filter: {databaseId: $databaseId, datetime_geq: $since}, orderBy: [datetime_DESC]) {
                  sum { rowsWritten }
                  max { databaseSizeBytes }
                }
                r2OperationsAdaptiveGroups(limit: 1, filter: {bucketName: $bucketName, datetime_geq: $since}) {
                  sum { classAOperations classBOperations }
                }
                r2StorageAdaptiveGroups(limit: 1, filter: {bucketName: $bucketName}, orderBy: [datetime_DESC]) {
                  max { payloadSize }
                }
              }
            }
          }
          """
          print(json.dumps({
              "query": query,
              "variables": {
                  "accountTag": account_tag,
                  "databaseId": database_id,
                  "bucketName": "stonks-private-history",
                  "since": window_start,
              },
          }))
          PY
          )"
          raw_response="$(mktemp)"
          trap 'rm -f "${raw_response}"' EXIT
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${request_body}" \
            https://api.cloudflare.com/client/v4/graphql > "${raw_response}"
          python3 - "${raw_response}" "${CLOUDFLARE_ACCOUNT_ID}" "${CLOUDFLARE_D1_DATABASE_ID}" "${window_start}" <<'PY' > remote-usage.json
          import json
          import sys
          from datetime import datetime, timezone

          raw_path, account_tag, database_id, window_start = sys.argv[1:5]
          raw = json.load(open(raw_path, encoding="utf-8"))
          if raw.get("errors"):
              # Pass errors straight through -- validate_remote_usage rejects
              # them explicitly and names the Account Analytics Read
              # permission when the message looks permission-related.
              print(json.dumps(raw))
              raise SystemExit(0)
          accounts = raw.get("data", {}).get("viewer", {}).get("accounts", [])
          account = accounts[0] if len(accounts) == 1 else {}
          d1_groups = account.get("d1AnalyticsAdaptiveGroups") or [{}]
          r2_ops = account.get("r2OperationsAdaptiveGroups") or [{}]
          r2_storage = account.get("r2StorageAdaptiveGroups") or [{}]
          reshaped = {
              "errors": None,
              "data": {
                  "viewer": {
                      "accounts": [
                          {
                              "accountTag": account_tag,
                              "observedAt": datetime.now(timezone.utc).isoformat(),
                              "d1": {
                                  "databaseId": database_id,
                                  "databaseSizeBytes": (d1_groups[0].get("max") or {}).get("databaseSizeBytes", 0),
                                  "rowsWritten24h": (d1_groups[0].get("sum") or {}).get("rowsWritten", 0),
                              },
                              "r2": {
                                  "bucketName": "stonks-private-history",
                                  "retainedBytes": (r2_storage[0].get("max") or {}).get("payloadSize", 0),
                                  "windowStart": window_start,
                                  "classAOperationsMonthToDate": (r2_ops[0].get("sum") or {}).get("classAOperations", 0),
                                  "classBOperationsMonthToDate": (r2_ops[0].get("sum") or {}).get("classBOperations", 0),
                              },
                          }
                      ]
                  }
              },
          }
          print(json.dumps(reshaped))
          PY

      - name: Read production snapshot publication state
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          pnpm --dir apps/api exec wrangler d1 execute stonks-research --env production --remote --command "SELECT 'snapshot' AS kind, instrument_id AS value FROM instrument_snapshots UNION ALL SELECT 'active_dataset' AS kind, dataset_id AS value FROM active_dataset WHERE singleton = 1" --json > remote-publication-state.json

      - name: Preflight remote publication budget
        if: steps.params.outputs.manifest_present == 'true'
        timeout-minutes: 5
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          MAX_D1_MUTATIONS_PER_RUN=50000
          MAX_D1_ROWS_WRITTEN_24H=90000
          MAX_D1_DATABASE_BYTES=400000000
          MAX_R2_CLASS_A_PER_MONTH=800000
          MAX_R2_CLASS_B_PER_MONTH=5000000
          # F11/F14: the monthly attempt envelope is computed from the
          # actual calendar month (plus reserved manual reruns) rather than
          # a hard-coded constant -- see
          # market_pipeline.publication.remote_usage.plan_monthly_attempts.
          # This is informational only here; the preflight CLI recomputes
          # the same value itself when given --remote-usage, so both derive
          # it from the same source rather than trusting this echo.
          echo "Monthly attempt envelope: $(uv run python -c 'from datetime import date; from market_pipeline.publication.remote_usage import plan_monthly_attempts; p = plan_monthly_attempts(date.today()); print(f"{p.monthly_attempts} ({p.scheduled_dates_in_month} scheduled + {p.reserved_manual_attempts} reserved manual)")')"
          if ! uv run python -m market_pipeline.publication.preflight --plan active-publication-plan.json \
            --d1-info d1-publication-info.json \
            --remote-usage remote-usage.json \
            --expected-account-id "${CLOUDFLARE_ACCOUNT_ID}" \
            --expected-database-id "${CLOUDFLARE_D1_DATABASE_ID}" \
            --expected-bucket-name stonks-private-history \
            --reservation-ledger .cache/publication-ledger.json \
            --remote-publication-state remote-publication-state.json \
            --resolved-plan resolved-publication-plan.json \
            --max-d1-mutations-per-run "${MAX_D1_MUTATIONS_PER_RUN}" \
            --max-d1-rows-written-24h "${MAX_D1_ROWS_WRITTEN_24H}" \
            --max-d1-database-bytes "${MAX_D1_DATABASE_BYTES}" \
            --max-r2-class-a-per-month "${MAX_R2_CLASS_A_PER_MONTH}" \
            --max-r2-class-b-per-month "${MAX_R2_CLASS_B_PER_MONTH}"; then
            echo "::error::remote publication plan exceeds the free-tier safety envelope"
            exit 1
          fi

      - name: Upload and verify private R2 history objects
        id: r2_upload
        if: steps.params.outputs.manifest_present == 'true'
        # Below four hours (F14): a hair under r2_sync's own internal
        # --deadline-seconds 14400 (exactly four hours) below, so a true
        # hang outside that internal deadline's own accounting (e.g. a
        # network stall the retry/deadline logic never observes) is still
        # bounded, leaving headroom in the job's own six-hour budget for
        # the D1 import/verification steps that must still run afterward.
        timeout-minutes: 235
        run: |
          set -euo pipefail
          # A single, synchronously-checked Python process is the entire
          # safety boundary here (findings F09/F10): no process
          # substitution, no per-object subshell, no `while read` loop
          # whose exit code could be swallowed by the pipe/substitution
          # around it. `set -euo pipefail` on this step now means exactly
          # what it says: any nonzero exit here fails the step outright,
          # and GitHub Actions skips every following promotion step
          # (including the D1 import that follows this one) unless a
          # later step explicitly opts back in with an always-run
          # condition, which none of the remaining promotion steps do.
          # `pipefail` (set above) means this pipeline's exit code is still
          # r2_sync's own -- `tee` never masks a failure -- while also
          # capturing its one summary line (R09/F14) so the reservation-
          # ledger step below can record the true attempted put/get counts
          # instead of an estimate.
          uv run python -m market_pipeline.publication.r2_sync \
            --bundle active-history-objects.json \
            --history-root history \
            --max-workers 16 \
            --deadline-seconds 14400 | tee r2-sync-summary.txt

      - name: Import active dataset into production D1
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          pnpm --dir apps/api exec wrangler d1 execute stonks-research --env production --remote --file active-dataset.sql

      - name: Verify remote active dataset
        if: steps.params.outputs.manifest_present == 'true'
        run: |
          set -euo pipefail
          expected_dataset_id="$(tr -d '\r\n' < active-dataset-id.txt)"
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          pnpm --dir apps/api exec wrangler d1 execute stonks-research --env production --remote \
            --command "SELECT dataset_id FROM active_dataset WHERE singleton = 1" --json > "${response_file}"
          remote_dataset_id="$(python3 - "${response_file}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          result = payload[0] if isinstance(payload, list) else payload
          rows = result.get("results", [])
          if len(rows) != 1 or not isinstance(rows[0].get("dataset_id"), str):
              raise SystemExit("remote D1 active_dataset query did not return exactly one dataset_id")
          print(rows[0]["dataset_id"])
          PY
          )"
          if [ "${remote_dataset_id}" != "${expected_dataset_id}" ]; then
            echo "::error::Remote active dataset does not match the locally published dataset."
            exit 1
          fi

      # F12: only now -- after production D1's active dataset has been
      # independently read back and confirmed to equal the locally
      # published dataset -- is this dataset's checkpoint archive promoted
      # to state/latest-success.json. Building/uploading the archive is
      # itself durable evidence of local checkpoint progress; advancing
      # the success pointer must never happen on that basis alone; see
      # market_pipeline.publication.checkpoint_archive's module docstring.
      - name: Back up checkpoint archive for recovery
        if: steps.params.outputs.manifest_present == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p .cache
          expected_dataset_id="$(tr -d '\r\n' < active-dataset-id.txt)"
          uv run python -m market_pipeline.publication.checkpoint_archive backup \
            --db market.db --raw-root raw \
            --promote --remote-active-dataset-id "${expected_dataset_id}" \
            --reservation-ledger .cache/publication-ledger.json \
            --result checkpoint-backup.json
          cat checkpoint-backup.json

      - name: Record this run's reservation-ledger entry
        # Fix round 1, Important #3: this must run even if a LATER step
        # (D1 import/verify) fails, because R2 quota was already spent by
        # the successful upload above and this ledger exists precisely to
        # record spent-but-not-yet-observed quota -- `always()` plus an
        # explicit check on the upload step's own outcome (not the job's
        # overall status) means this step still runs on a post-upload
        # failure, but is correctly skipped if the upload itself never
        # succeeded (nothing was spent to record).
        if: always() && steps.params.outputs.manifest_present == 'true' && steps.r2_upload.outcome == 'success'
        run: |
          set -euo pipefail
          # A live GraphQL Analytics observation lags real usage (ingestion
          # delay). This durable, conservative ledger records what THIS
          # publisher actually attempted this run so the next run's
          # preflight can bridge that lag rather than treat a stale
          # observation as complete -- see
          # market_pipeline.publication.remote_usage.append_reservation_ledger_entry.
          # Fix round 1, Important #4: r2_sync's own summary line (captured
          # by the upload step above) already reports the true attempted
          # put/get counts, including every retry and reuse-verification
          # request -- use that real count, not an estimate derived from
          # the plan's object counts (which does not account for retries
          # and would otherwise under-reserve, the unsafe direction for a
          # conservative ledger).
          mkdir -p .cache
          uv run python3 - resolved-publication-plan.json r2-sync-summary.txt .cache/publication-ledger.json <<'PY'
          import json
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          from market_pipeline.publication.remote_usage import ReservationLedgerEntry, append_reservation_ledger_entry

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          summary = Path(sys.argv[2]).read_text(encoding="utf-8")
          match = re.search(
              r"verified (\d+) objects \((\d+) bytes\) with \d+ attempted requests \((\d+) put, (\d+) get\)",
              summary,
          )
          if match is None:
              raise SystemExit(
                  "could not parse r2_sync's summary line -- refusing to record an "
                  "unverified reservation-ledger entry: " + repr(summary)
              )
          _verified_objects, verified_bytes, put_attempts, get_attempts = (int(group) for group in match.groups())
          entry = ReservationLedgerEntry(
              recorded_at=datetime.now(timezone.utc),
              d1_mutations=int(plan["d1_mutations"]),
              # R2's own billing classes: PUT/POST/LIST/DELETE are Class A,
              # GET/HEAD are Class B -- matching r2_sync's put/get attempt
              # split directly onto the same classes preflight budgets.
              r2_class_a_operations=put_attempts,
              r2_class_b_operations=get_attempts,
              r2_bytes=verified_bytes,
          )
          append_reservation_ledger_entry(Path(sys.argv[3]), entry, now=entry.recorded_at)
          PY
