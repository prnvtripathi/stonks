name: Deploy

# Ships the private research Worker (API + built SPA, see
# apps/api/wrangler.jsonc) to Cloudflare through a strict preview-then-
# production gate. See docs/operations/deploy.md for the full rationale,
# the exact secrets/variables this workflow expects, and the manual
# Cloudflare-side setup (Access applications, API token scopes, the
# "production" GitHub Environment's required-reviewer rule) that no
# workflow file can express on its own.
#
# Action pinning: this repository's existing workflows (ci.yml,
# daily-data.yml) pin third-party actions to a version tag (e.g. `@v4`),
# not a commit SHA. This workflow matches that convention for consistency.
# SHA-pinning every action would be a stronger supply-chain control and is
# worth adopting repository-wide in a follow-up; it is not introduced here
# unilaterally for just this one new workflow.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A second push while a deploy is in flight must queue behind it, never run
# concurrently against the same D1 migration state or race a partially
# rolled out Worker. Never cancel a deploy that is already applying
# migrations or has already touched production.
#
# R12/F15: this used to be one workflow-level `group: deploy` covering both
# jobs. It is now two job-level concurrency groups instead (GitHub Actions
# allows only one concurrency block per *scope* -- workflow or job -- not
# two workflow-level blocks in one file), so that:
#   - `preview` still serializes against other `preview` runs (unchanged
#     behavior: two pushes in quick succession still queue their preview
#     jobs rather than racing the preview D1 database/Worker), under its
#     own `deploy-preview` group.
#   - `production` serializes against other `production` runs (unchanged),
#     AND now ALSO against .github/workflows/daily-data.yml's `refresh`
#     job, under the shared `production-d1-writer` group -- see that
#     workflow's concurrency comment. Both jobs mutate the same production
#     D1 database and were previously not mutually exclusive at all.
# `preview` deliberately does NOT join `production-d1-writer`: it never
# touches the production database, so a preview deploy queuing behind an
# unrelated daily data refresh would be an unnecessary delay, not a needed
# safety property.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Job 1: validate, test, then migrate+deploy+smoke-test PREVIEW only.
  # Nothing in this job can touch production resources: its Cloudflare API
  # token, D1 database, R2 bucket, and Access application are all distinct
  # from production's (see apps/api/wrangler.jsonc `env.preview` and
  # security-checklist.md's token-scoping section).
  # ---------------------------------------------------------------------
  preview:
    name: Validate, test, and deploy preview
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    outputs:
      preview_url: ${{ vars.PREVIEW_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Step order below follows the plan's required gate exactly:
      # validate source policy -> run all tests -> migrate preview ->
      # deploy preview -> authenticated smoke test -> (job 2) migrate
      # production -> deploy production -> read-only production smoke test.

      - name: Validate source policy
        run: uv run pytest pipeline/tests/sources/test_registry.py -v

      - name: Run all tests (Python)
        run: |
          uv run ruff check .
          uv run mypy pipeline
          uv run pytest

      - name: Install Playwright browsers
        run: pnpm --filter @stonks/web exec playwright install --with-deps chromium

      - name: Run all tests (Node)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm --filter @stonks/web test:e2e

      - name: Build the SPA (wrangler deploy serves apps/web/dist as static assets)
        run: pnpm --filter @stonks/web build

      - name: Migrate preview D1 database
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply stonks-research-preview --env preview --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Authenticated smoke test (preview)
        # CF_ACCESS_SERVICE_TOKEN_ID / _SECRET are a Cloudflare Access
        # Service Token bound to the preview Access application (Cloudflare
        # Zero Trust > Access > Service Auth), distinct from the owner's
        # interactive identity. Cloudflare's edge exchanges the
        # CF-Access-Client-Id/Secret header pair for a verified Access JWT
        # before the request ever reaches this Worker.
        #
        # R12/F15: Cloudflare Access service-token JWTs carry a
        # `common_name` claim instead of `email`, so this service token is
        # authorized through the separate, explicit allowlist in
        # ACCESS_ALLOWED_SERVICE_TOKENS (see apps/api/src/env.ts and
        # apps/api/src/middleware/access.ts's `authorizeIdentity`) rather
        # than ACCESS_ALLOWED_EMAILS. That allowlist entry scopes this
        # identity ONLY to `GET /api/v1/status` -- it is never mapped to an
        # owner email and can never authorize a mutation (see
        # apps/api/src/middleware/access.test.ts). With that in place this
        # step requires a genuine 200 -- accepting 401 as "healthy" (as this
        # step used to, before the common_name allowlist existed) is exactly
        # the F15 gap this task closes, so a 401 here now fails the step. A
        # bootstrap `datasetId: null` in the response body is an explicit
        # healthy-empty state (no dataset published yet, e.g. right after
        # first deploy) and is accepted here; the daily-data.yml
        # reconciliation gate is the place that separately requires a real
        # dataset ID once a first publish is expected.
        #
        # This step ALSO runs scripts/ci/assert-anonymous-denied.sh, a
        # second, credential-free check that sends a plain GET with no
        # Access/Authorization headers at all. It now requires actual
        # denial evidence (401, 403, or a redirect to Access's hosted login
        # page) rather than accepting any non-200 as proof -- a 5xx, 404, or
        # transport failure is treated as inconclusive, not "denied" (see
        # that script's header comment for the full rationale).
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/preview-smoke.json -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_SERVICE_TOKEN_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_SERVICE_TOKEN_SECRET }}" \
            "${{ vars.PREVIEW_URL }}/api/v1/status")
          echo "preview /api/v1/status responded $status"
          if [ "$status" != "200" ]; then
            echo "::error::Expected 200 from the approved Access service-token identity smoke check, got $status. See ACCESS_ALLOWED_SERVICE_TOKENS / apps/api/src/middleware/access.ts."
            cat /tmp/preview-smoke.json || true
            exit 1
          fi
          if ! jq -e 'has("datasetId") and has("sources") and (.sources | type == "array")' /tmp/preview-smoke.json > /dev/null; then
            echo "::error::/api/v1/status response body is not valid status JSON (expected datasetId and sources fields)"
            cat /tmp/preview-smoke.json
            exit 1
          fi
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-anonymous-denied.sh" "${{ vars.PREVIEW_URL }}/api/v1/status"

  # ---------------------------------------------------------------------
  # Job 2: migrate+deploy+smoke-test PRODUCTION. Depends on `preview`
  # succeeding. The "production" GitHub Environment referenced below must
  # have a required-reviewer protection rule configured in the repository
  # settings (Settings > Environments > production) -- that manual approval
  # step is the actual preview-to-production gate; GitHub pauses this job
  # until an approver acts, and no workflow YAML can express that rule
  # itself. See docs/operations/deploy.md.
  # ---------------------------------------------------------------------
  production:
    name: Migrate and deploy production
    needs: preview
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-d1-writer
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the SPA (wrangler deploy serves apps/web/dist as static assets)
        run: pnpm --filter @stonks/web build

      - name: Migrate production D1 database
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply stonks-research --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Read-only production smoke test
        # GET only -- this step must never call a mutating route (no POST
        # /api/v1/screens, no PUT, no /runs); the scoped service-token
        # identity used here is authorized only for GET /api/v1/status
        # anyway (see apps/api/src/middleware/access.ts), so a mutation
        # attempt would be rejected with 403 even if one were added here by
        # mistake. Same scoped-service-token identity and strict-200 +
        # valid-JSON requirement as the preview smoke test above (R12/F15),
        # and the same hardened fail-open detector
        # (scripts/ci/assert-anonymous-denied.sh) run against production --
        # this is the single most important place for that check to run,
        # since a fail-open bug here means the live, already-launched
        # application is serving anonymous requests. Note that a real 200
        # here proves Access's edge and this application's own scoped
        # service-token check both work; it does NOT prove the *owner's*
        # interactive Access login is configured correctly, since a service
        # token is a different credential path -- that still needs the
        # manual owner-authenticated check in docs/operations/deploy.md.
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/production-smoke.json -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_SERVICE_TOKEN_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_SERVICE_TOKEN_SECRET }}" \
            "${{ vars.PRODUCTION_URL }}/api/v1/status")
          echo "production /api/v1/status responded $status"
          if [ "$status" != "200" ]; then
            echo "::error::Expected 200 from the approved Access service-token identity smoke check, got $status. See ACCESS_ALLOWED_SERVICE_TOKENS / apps/api/src/middleware/access.ts."
            cat /tmp/production-smoke.json || true
            exit 1
          fi
          if ! jq -e 'has("datasetId") and has("sources") and (.sources | type == "array")' /tmp/production-smoke.json > /dev/null; then
            echo "::error::/api/v1/status response body is not valid status JSON (expected datasetId and sources fields)"
            cat /tmp/production-smoke.json
            exit 1
          fi
          bash "${GITHUB_WORKSPACE}/scripts/ci/assert-anonymous-denied.sh" "${{ vars.PRODUCTION_URL }}/api/v1/status"
